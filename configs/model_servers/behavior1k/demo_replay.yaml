# BEHAVIOR-1K — demo-replay model server (LeRobot v3.0, behavior-1k/2026-challenge-demos).
# Replays recorded human-teleop actions, one episode per task, to check that the env wiring
# (action space, instance loading, success detection) matches the released dataset.
#
# Download only the chunks you need (chunk-NNN = task index), e.g. for turning_on_radio:
#   hf download behavior-1k/2026-challenge-demos --repo-type dataset --local-dir <demo_root> \
#     --include "data/chunk-000/file-000.parquet" --include "meta/episodes/chunk-000/*"
# Pair with configs/benchmarks/behavior1k/demo_replay.yaml, whose instance must equal each
# episode's ``task_instance_id`` (episode 0 and 200 are both instance 1).
script: "src/vla_eval/model_servers/behavior1k_demo_replay.py"
args:
  demo_root: "/data/2026-challenge-demos"
  episodes:
    turning_on_radio: 0
    picking_up_trash: 200
  port: 8000
