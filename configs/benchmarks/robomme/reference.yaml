# RoboMME Reference suite (4 tasks × 50 episodes)
server:
  url: "ws://localhost:8000"

# Default to software rendering (lavapipe): SAPIEN's native NVIDIA path hangs at the
# first image capture on a small subset of hosts (hardware dependent, issue #112).
# On a known-good host, pass --render gpu for a roughly 5-10x faster simulator.
render: cpu

docker:
  image: ghcr.io/allenai/vla-evaluation-harness/robomme:latest
  env:
    - "NVIDIA_DRIVER_CAPABILITIES=all"
  volumes:
    - "/usr/share/vulkan/icd.d:/usr/share/vulkan/icd.d:ro"

output_dir: "./results"

benchmarks:
  - benchmark: "vla_eval.benchmarks.robomme.benchmark:RoboMMEBenchmark"
    subname: reference
    episodes_per_task: 50
    params:
      tasks: [PickHighlight, VideoRepick, VideoPlaceButton, VideoPlaceOrder]
      action_space: joint_angle
      max_steps: 1300
