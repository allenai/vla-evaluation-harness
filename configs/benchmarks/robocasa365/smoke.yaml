# Short contract smoke test; this is not the benchmark protocol.
server:
  url: "ws://localhost:8000"

docker:
  image: ghcr.io/allenai/vla-evaluation-harness/robocasa365:latest

output_dir: "./results"

benchmarks:
  - benchmark: "vla_eval.benchmarks.robocasa365.benchmark:RoboCasa365Benchmark"
    episodes_per_task: 1
    action_dim: 12
    params:
      tasks: [KettleBoiling]
      split: pretrain
      seed: 0
      camera_size: 256
      # Cut the registry horizon down to one short chunk so the run still
      # exercises the horizon-reached and success-sampling paths.
      max_steps: 8
      success_check_interval: 8
