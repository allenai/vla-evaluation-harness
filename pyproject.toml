[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "vla-eval"
dynamic = ["version"]
description = "Evaluation harness for Vision-Language-Action models"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
dependencies = [
    "anyio>=4.0.0",
    "imageio[ffmpeg]",      # Streaming mp4 writer for benchmarks/video.py
    "jsonargparse[signatures]>=4.36",  # class-signature-driven argparse + yaml
    "lazyregistry>=0.4.0",  # Python 3.8 support
    "msgpack>=1.0.0",
    "numpy>=1.24",
    "omegaconf",
    "pillow>=9.4.0",        # PIL.Image.ExifTags introduced in 9.4.0
    "pyyaml>=6.0",          # Security fixes (CVE-2020-14343) + Python 3.11
    "rich>=13.0",
    "tqdm",
    "typing_extensions>=4.0; python_version < '3.11'",  # NotRequired backport for results/collector.py
    "websockets>=13.0",  # 13.0 adds websockets.asyncio.server, the implementation serve.py imports
]

[project.optional-dependencies]
pusht = ["gym-pusht==0.1.6; python_version >= '3.10'", "pymunk<7; python_version >= '3.10'"]

[dependency-groups]
dev = ["jsonschema>=4.0", "pytest>=8.0", "ruff>=0.9", "ty>=0.0.18"]
# leaderboard/scripts runtime deps. Tooling comes from `dev`, so CI can sync
# `--dev --group leaderboard --no-install-project` without pulling vla_eval's runtime.
leaderboard = [
    "beautifulsoup4>=4.12",
    "markdownify>=0.14",
    "typer>=0.12",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/vla_eval/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vla_eval"]

[project.scripts]
vla-eval = "vla_eval.cli.main:main"

[tool.pytest.ini_options]
# Explicit: keep discovery out of .cache, experiments, site.
testpaths = ["tests", "leaderboard/tests"]

[tool.uv]
# Fresh clones resolve to this date, so a newly published (possibly compromised) version is
# never picked up without intent. Bump when upgrading on purpose.
exclude-newer = "2026-07-07"

[tool.ruff]
line-length = 119

# Ruff 0.16 grew the default rule set (59 -> 413) and formats Markdown code blocks. Pin to what
# this repo was written against; CI installs the latest ruff.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.ty.environment]
python-version = "3.11"

# Adapters import simulators that only exist in their images; on the host `unresolved-import = "ignore"`
# made them a silent pass or a check against a random version. base.py and video.py stay checked.
[tool.ty.src]
exclude = ["src/vla_eval/benchmarks/*/"]

[tool.ty.rules]
unresolved-import = "ignore"
