# RoboTwin 2.0 Easy (demo_clean) under X-VLA's protocol (evaluation/robotwin-2.0/client.py):
# 50 tasks x 100 episodes, end-effector actions, each 30-action chunk executed whole and
# re-queried at most 10 times (max_steps 300). Serve configs/model_servers/xvla/robotwin.yaml.
# Seeds are RoboTwin's expert-checked ones from 100000 (bundled); X-VLA's client draws from 2000.
# --benchmark-field max_steps=null runs to RoboTwin's per-task step limits, which the paper's
# long tasks need (docs/reproductions/xvla.md).
server:
  url: "ws://localhost:8000"

docker:
  image: ghcr.io/allenai/vla-evaluation-harness/robotwin:latest

output_dir: "./results"

benchmarks:
  - &task
    benchmark: "vla_eval.benchmarks.robotwin.benchmark:RoboTwinBenchmark"
    subname: adjust_bottle
    episodes_per_task: 1  # each seed is one task; test_num sets the episode count
    max_steps: 300
    params: &params
      task_name: adjust_bottle
      task_config: demo_clean
      seed: 0
      test_num: 100
      action_type: ee
      send_state: true
      render_every: 30  # the chunk runs open loop; render only where the server queries
  - {<<: *task, subname: beat_block_hammer, params: {<<: *params, task_name: beat_block_hammer}}
  - {<<: *task, subname: blocks_ranking_rgb, params: {<<: *params, task_name: blocks_ranking_rgb}}
  - {<<: *task, subname: blocks_ranking_size, params: {<<: *params, task_name: blocks_ranking_size}}
  - {<<: *task, subname: click_alarmclock, params: {<<: *params, task_name: click_alarmclock}}
  - {<<: *task, subname: click_bell, params: {<<: *params, task_name: click_bell}}
  - {<<: *task, subname: dump_bin_bigbin, params: {<<: *params, task_name: dump_bin_bigbin}}
  - {<<: *task, subname: grab_roller, params: {<<: *params, task_name: grab_roller}}
