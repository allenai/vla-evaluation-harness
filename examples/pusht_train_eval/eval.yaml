# Push-T evaluation used between training steps. The benchmark class ships with vla-eval;
# docker.image is only used with --docker.
server:
  url: "ws://localhost:8000"

docker:
  image: ghcr.io/allenai/vla-evaluation-harness/pusht:latest

render: cpu

benchmarks:
  - benchmark: "vla_eval.benchmarks.pusht.benchmark:PushTBenchmark"
    episodes_per_task: 20
    params:
      seed: 1000   # disjoint from the training episodes; fixed, so eval rounds are comparable
    action_dim: 2
