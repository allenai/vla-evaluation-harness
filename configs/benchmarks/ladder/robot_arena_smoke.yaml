# Minimal LADDER RobotArena-Long smoke test (1 task, 1 episode).
server:
  url: "ws://localhost:8000"

docker:
  image: ghcr.io/allenai/vla-evaluation-harness/ladder-robot-arena:latest

output_dir: "./results"

benchmarks:
  - benchmark: "vla_eval.benchmarks.ladder.benchmark:LadderRobotArenaBenchmark"
    episodes_per_task: 1
    max_tasks: 1
    max_steps: 20
    action_dim: 7
    params:
      num_envs: 1
      tasks:
        - scene54_1goal
      seed: 42
      action_mode: "delta_ee"
