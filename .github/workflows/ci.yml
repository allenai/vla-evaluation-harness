name: CI

on:
  push:
    branches: [main]
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  ty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run --python 3.11 --dev ty check

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v3
      - run: ruff check
      - run: ruff format --check --diff

  test-vla-eval:
    runs-on: ubuntu-latest
    name: Pytest (vla_eval)
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install vla_eval deps
        run: uv sync --python 3.11 --all-extras --dev
        env:
          UV_TORCH_BACKEND: auto
      - name: Run pytest
        run: uv run pytest tests/

  test-leaderboard:
    runs-on: ubuntu-latest
    name: Pytest (leaderboard)
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install leaderboard deps
        # --no-install-project so we don't pull vla_eval's runtime
        # (anyio, websockets, numpy, …) for tests that only touch
        # leaderboard/scripts/*.py. --group leaderboard gets the
        # uv-script-level deps (typer, bs4, markdownify); --dev gets
        # pytest + jsonschema.
        run: uv sync --python 3.11 --no-install-project --dev --group leaderboard
      - name: Run pytest
        run: uv run pytest leaderboard/tests/

  example-pusht:
    runs-on: ubuntu-latest
    name: Example (pusht train + eval)
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Run the training-time evaluation example end to end
        # The example is its own uv project (vla-eval from this checkout via [tool.uv.sources]).
        working-directory: examples/pusht_train_eval
        run: |
          uv sync --python 3.12
          uv run train.py --steps 20 --eval-every 10 --eval-episodes 2 --eval-max-steps 30
