# Kinetix evaluation (40 tasks × 100 episodes)
server:
  url: "ws://localhost:8000"

docker:
  image: ghcr.io/allenai/vla-evaluation-harness/kinetix:latest

output_dir: "./results"

benchmarks:
  - benchmark: "vla_eval.benchmarks.kinetix.benchmark:KinetixBenchmark"
    episodes_per_task: 100
    params:
      seed: 0
      observation_type: symbolic
      max_episode_steps: 256
      rtc_worlds_dir: "/app/rtc/worlds"
      action_noise_std: 0.1
      # Episodes per jax.vmap batch (sync mode only). Each slot replays its single-env
      # episode exactly, so results match num_envs: 1.
      num_envs: 1
    action_dim: 6
