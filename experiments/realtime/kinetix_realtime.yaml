# Kinetix evaluation — real-time mode (12 RTC tasks); the step loop starts once the server is ready.
# The results in inference_delay_results.md were taken with the since removed wait_first_action: true.
server:
  url: "ws://localhost:8000"

docker:
  image: ghcr.io/allenai/vla-evaluation-harness/kinetix:latest

output_dir: "./results"

benchmarks:
  - benchmark: "vla_eval.benchmarks.kinetix.benchmark:KinetixBenchmark"
    mode: live
    hz: 10.0
    pace: 1.0
    episodes_per_task: 20
    params:
      seed: 0
      observation_type: symbolic
      max_episode_steps: 256
      rtc_worlds_dir: "/app/rtc/worlds"
      action_noise_std: 0.1
