# RoboCasa365 multi-task evaluation: 50 target tasks x 50 seeded episodes,
# each running to its own registry horizon.
server:
  url: "ws://localhost:8000"

docker:
  image: ghcr.io/allenai/vla-evaluation-harness/robocasa365:latest

output_dir: "./results"

benchmarks:
  - benchmark: "vla_eval.benchmarks.robocasa365.benchmark:RoboCasa365Benchmark"
    episodes_per_task: 50
    action_dim: 12
    params:
      split: pretrain
      seed: 0
      camera_size: 256
      success_check_interval: 16
