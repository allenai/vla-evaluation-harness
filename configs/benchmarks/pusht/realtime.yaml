# Push-T in live mode: env advances at 10 Hz whether or not an action arrived.
extends: eval.yaml

benchmarks:
  - benchmark: "vla_eval.benchmarks.pusht.benchmark:PushTBenchmark"
    mode: live
    hz: 10.0
    pace: 1.0
    episodes_per_task: 50
    params:
      seed: 0
      max_episode_steps: 300
    action_dim: 2
